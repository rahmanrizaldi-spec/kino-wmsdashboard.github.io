/* Animated atmosphere */
.stage::before{
  content:"";
  position:absolute;
  inset:-20%;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 35%,rgba(56,189,248,.16),transparent 14%),
    radial-gradient(circle at 78% 28%,rgba(192,132,252,.14),transparent 15%),
    radial-gradient(circle at 50% 75%,rgba(251,191,36,.10),transparent 13%);
  filter:blur(18px);
  animation:ambient 9s ease-in-out infinite alternate;
}

.sweep{
  position:absolute;
  z-index:2;
  top:-15%;
  left:-35%;
  width:18%;
  height:140%;
  transform:skewX(-18deg);
  pointer-events:none;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.04) 35%,
    rgba(125,211,252,.30) 50%,
    rgba(255,255,255,.04) 65%,
    transparent
  );
  filter:blur(7px);
  animation:sweep 6s ease-in-out infinite;
}

.light{
  position:absolute;
  z-index:3;
  width:7px;height:7px;
  border-radius:50%;
  pointer-events:none;
  background:#fff;
  box-shadow:0 0 8px currentColor,0 0 24px currentColor;
}
.l1{left:19%;top:29%;color:#38bdf8;animation:float1 5s infinite}
.l2{left:72%;top:19%;color:#fbbf24;animation:float2 6s infinite}
.l3{left:82%;top:61%;color:#c084fc;animation:float3 5.5s infinite}
.l4{left:36%;top:74%;color:#34d399;animation:float4 7s infinite}

.panel{
  position:absolute;
  z-index:5;
  inset:0;
  width:100%;
  height:100%;
  padding:0;
  transform:none;
}

.hotspot{
  position:absolute;
  display:block;
  border:0;
  background:transparent;
  border-radius:22px;
  text-decoration:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}

.hotspot::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:22px;
  pointer-events:none;
  background:linear-gradient(
    115deg,
    transparent 20%,
    rgba(255,255,255,.05) 42%,
    rgba(255,255,255,.35) 50%,
    rgba(255,255,255,.05) 58%,
    transparent 80%
  );
  transform:translateX(-130%);
  animation:cardShine 4s ease-in-out infinite;
}

.hotspot::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:22px;
  pointer-events:none;
  opacity:.05;
  animation:pulse 2.8s ease-in-out infinite;
}

.clickable:hover::after{
  opacity:.9;
}

.clickable:hover{
  filter:brightness(1.13);
}

.pia{
  left:20.1%;top:42.7%;width:11.3%;height:27.5%;
}
.binbee{
  left:32.3%;top:42.7%;width:11.3%;height:27.5%;
}
.kapuk{
  left:44.4%;top:42.7%;width:11.3%;height:27.5%;
}
.cross{
  left:56.5%;top:42.7%;width:11.3%;height:27.5%;
}
.sodo{
  left:68.7%;top:42.7%;width:11.3%;height:27.5%;
}

.pia::after{box-shadow:inset 0 0 25px #38bdf8,0 0 28px #38bdf8}
.binbee::after{box-shadow:inset 0 0 25px #c084fc,0 0 28px #c084fc}
.kapuk::after{box-shadow:inset 0 0 25px #34d399,0 0 28px #34d399}
.cross::after{box-shadow:inset 0 0 25px #fbbf24,0 0 28px #fbbf24}
.sodo::after{box-shadow:inset 0 0 25px #fb7185,0 0 28px #fb7185}

.disabled{
  cursor:not-allowed;
}
.disabled::before{
  animation:none;
}

@keyframes sweep{
  0%,12%{left:-35%;opacity:0}
  25%{opacity:1}
  58%{opacity:.7}
  82%,100%{left:120%;opacity:0}
}
@keyframes ambient{
  0%{transform:translate(-2%,0) scale(1);opacity:.5}
  50%{transform:translate(3%,-2%) scale(1.08);opacity:1}
  100%{transform:translate(-1%,2%) scale(1.03);opacity:.6}
}
@keyframes cardShine{
  0%,30%{transform:translateX(-130%);opacity:0}
  43%{opacity:1}
  62%,100%{transform:translateX(130%);opacity:0}
}
@keyframes pulse{
  0%,100%{transform:scale(.98);opacity:.05}
  45%{transform:scale(1);opacity:.55}
  70%{transform:scale(1.025);opacity:.10}
}
@keyframes float1{
  0%,100%{transform:translate(0,0) scale(.6);opacity:.2}
  40%{transform:translate(100px,-35px) scale(1.5);opacity:1}
  75%{transform:translate(150px,50px) scale(.7);opacity:.3}
}
@keyframes float2{
  0%,100%{transform:translate(0,0) scale(.5);opacity:.2}
  45%{transform:translate(-100px,65px) scale(1.5);opacity:1}
  80%{transform:translate(-45px,125px) scale(.7);opacity:.3}
}
@keyframes float3{
  0%,100%{transform:translate(0,0) scale(.5);opacity:.2}
  45%{transform:translate(-75px,-75px) scale(1.5);opacity:1}
  80%{transform:translate(-135px,-5px) scale(.7);opacity:.3}
}
@keyframes float4{
  0%,100%{transform:translate(0,0) scale(.5);opacity:.2}
  45%{transform:translate(70px,-65px) scale(1.5);opacity:1}
  80%{transform:translate(135px,-5px) scale(.7);opacity:.3}
}

@media(max-width:760px){
  html,body{overflow:auto}
  .stage{
    min-height:100vh;
    height:auto;
    background-position:center center;
  }
  .panel{
    position:relative;
    left:auto;top:auto;
    transform:none;
    width:100%;
    min-height:100vh;
  }
  .hotspot{
    position:absolute;
  }
  .pia{left:12%;top:42%;width:35%;height:18%}
  .binbee{left:53%;top:42%;width:35%;height:18%}
  .kapuk{left:12%;top:62%;width:35%;height:18%}
  .cross{left:53%;top:62%;width:35%;height:18%}
  .sodo{left:32.5%;top:82%;width:35%;height:15%}
}

@media(prefers-reduced-motion:reduce){
  .stage::before,.sweep,.light,.hotspot::before,.hotspot::after{
    animation:none!important;
  }
}

/* ===== TRUE MOBILE LAYOUT ===== */
.mobile-content {
  display:none;
}

@media (max-width:760px) {
  html, body {
    width:100%;
    min-height:100%;
    height:auto;
    overflow-x:hidden;
    overflow-y:auto;
    background:#06152c;
  }

  .stage {
    width:100%;
    min-height:100vh;
    height:auto;
    padding:0 12px 34px;
    background:
      linear-gradient(180deg, rgba(3,17,38,.0) 0, #06152c 290px),
      #06152c;
  }

  /* Mobile hero: KINO building/logo only. */
  .stage::before {
    content:"";
    display:block;
    position:absolute;
    z-index:0;
    top:0;
    left:0;

  .stage::after {
    content:"";
    position:absolute;
    z-index:0;
    top:0;
    left:0;
    width:100%;
    height:300px;
    background:linear-gradient(
      180deg,
      rgba(2,10,28,.02) 0%,
      rgba(2,10,28,.08) 55%,
      #06152c 100%
    );
    pointer-events:none;
  }

  .stage > .sweep,
  .stage > .light,
  .panel {
    display:none !important;
  }

  .mobile-content {
    display:block;
    position:relative;
    z-index:10;
    width:100%;
    padding-top:225px;
  }

  .mobile-title {
    text-align:center;
    font-size:clamp(23px,7vw,31px);
    line-height:1.15;
    font-weight:850;
    margin:0 auto 20px;
    color:#fff;
    text-shadow:0 3px 16px rgba(0,0,0,.55);
  }

  .mobile-title span {
    background:linear-gradient(90deg,#67e8f9,#60a5fa,#c4b5fd);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .mobile-panel {
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
    padding:11px;
    border-radius:23px;
    background:rgba(10,27,55,.58);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:
      0 22px 50px rgba(0,0,0,.38),
      inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
  }

  .mobile-card {
    min-width:0;
    min-height:158px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.28);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff;
    text-decoration:none;
    position:relative;
    overflow:hidden;
    padding:12px 7px;
    background:linear-gradient(
      145deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.045)
    );
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.12),
      0 9px 22px rgba(0,0,0,.22);
    transition:transform .2s ease,filter .2s ease;
  }

  .mobile-card:active {
    transform:scale(.97);
  }

  .mobile-card::before {
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
      115deg,
      transparent 25%,
      rgba(255,255,255,.28) 50%,
      transparent 75%
    );
    transform:translateX(-130%);
    animation:mobileShine 4.5s ease-in-out infinite;
    pointer-events:none;
  }

  .mobile-icon {
    width:58px;
    height:58px;
    border-radius:16px;
    display:grid;
    place-items:center;
    font-size:27px;
    margin-bottom:11px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.34);
    box-shadow:0 0 20px rgba(56,189,248,.22);
    position:relative;
    z-index:1;
  }

  .mobile-name {
    font-size:13px;
    line-height:1.2;
    font-weight:800;
    position:relative;
    z-index:1;
  }

  .mobile-arrow {
    width:30px;
    height:30px;
    margin-top:9px;
    border:1px solid rgba(255,255,255,.65);
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:17px;
    position:relative;
    z-index:1;
  }

  .mobile-maint {
    margin-top:9px;
    padding:6px 9px;
    border-radius:999px;
    background:linear-gradient(#fde68a,#fbbf24);
    color:#3b2500;
    font-size:9px;
    line-height:1;
    font-weight:900;
    white-space:nowrap;
    position:relative;
    z-index:1;
  }

  .mobile-pia { box-shadow:inset 0 0 25px rgba(56,189,248,.17),0 9px 22px rgba(0,0,0,.22); }
  .mobile-binbee { box-shadow:inset 0 0 25px rgba(192,132,252,.17),0 9px 22px rgba(0,0,0,.22); }
  .mobile-kapuk { box-shadow:inset 0 0 25px rgba(52,211,153,.17),0 9px 22px rgba(0,0,0,.22); }
  .mobile-cross { box-shadow:inset 0 0 25px rgba(251,191,36,.17),0 9px 22px rgba(0,0,0,.22); }
  .mobile-sodo { box-shadow:inset 0 0 25px rgba(251,113,133,.17),0 9px 22px rgba(0,0,0,.22); }

  @keyframes mobileShine {
    0%,30% { transform:translateX(-130%); opacity:0; }
    43% { opacity:1; }
    62%,100% { transform:translateX(130%); opacity:0; }
  }

  @media(max-width:430px) {
    .stage { padding-left:9px; padding-right:9px; }
    .mobile-content { padding-top:220px; }
    .mobile-panel { gap:9px; padding:9px; }
    .mobile-card { min-height:150px; }
    .mobile-icon { width:54px; height:54px; font-size:25px; }
    .mobile-name { font-size:12.5px; }
  }
}

</style>
